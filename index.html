<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Book</title>
<style>
:root{--desk:#f7f9f7;--desk2:#dfe6e1;--paper:#ffffff;--panel:#1b2f38;--line:rgba(255,255,255,.18);--accent:#e39a56;--txt:#e6ece8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{padding-top:56px;background:radial-gradient(ellipse at 50% 30%,var(--desk),var(--desk2));font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;-webkit-user-select:none;user-select:none}
.book{position:relative;width:min(92vw,440px);aspect-ratio:3/5;max-height:min(80vh,calc(100dvh - 190px));perspective:1600px;touch-action:pan-y}
.book::before{content:"";position:absolute;inset:6px -5px -6px 5px;background:var(--paper);border-radius:4px 10px 10px 4px;opacity:.45}
.page{position:absolute;inset:0;background:#FBF8F1;border-radius:4px 10px 10px 4px;transform-origin:left center;backface-visibility:hidden;overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.35);will-change:transform}
.page img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent 7%)}
.anim .page{transition:transform .55s cubic-bezier(.4,.1,.2,1),opacity .55s}
@media (prefers-reduced-motion:reduce){.anim .page{transition-duration:.01s}}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;color:#3a4a45}
.bar button{font:inherit;font-size:1.3rem;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.bar button:disabled{opacity:.3;cursor:default}
.bar span{text-align:center;font-size:.9rem}
#hint{font-size:.95rem;font-weight:600;letter-spacing:.02em}
#count{opacity:.7;font-size:.8rem}
.gear{position:fixed;z-index:200;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;height:38px;padding:0 14px 0 11px;display:flex;align-items:center;gap:7px;border-radius:999px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.92);color:#3a4a45;font:inherit;font-size:.85rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:pointer}
.gear{opacity:0;pointer-events:none;transition:opacity .25s}
.gear.show{opacity:1;pointer-events:auto}
#hot{position:fixed;top:0;right:0;width:64px;height:calc(56px + env(safe-area-inset-top,0px));z-index:150;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.gear svg{width:18px;height:18px;display:block;flex:none}
.gear:active{transform:scale(.94)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sheet{position:fixed;inset:0;background:var(--panel);z-index:50;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{display:flex}
.sheet header{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet h1{font-size:1.1rem;font-weight:600}
.btn{font:inherit;font-size:.9rem;border:1px solid var(--line);background:transparent;color:var(--txt);padding:.5em .9em;border-radius:99px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1208;font-weight:600}
.btn.del{color:#ff9b8f}
.list{flex:1;overflow-y:auto;padding:10px 16px 24px;-webkit-user-select:none}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item img{width:56px;height:78px;object-fit:cover;border-radius:4px;flex:none;background:#0003}
.item .meta{flex:1;font-size:.9rem;min-width:0}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.empty{padding:40px 0;text-align:center;opacity:.7}
.lock{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
.lock.open{display:flex}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(100%,320px);display:flex;flex-direction:column;gap:12px;-webkit-user-select:auto;user-select:auto}
.lock h2{font-size:1.05rem;font-weight:600}
.lock input{font:inherit;font-size:1.1rem;padding:.6em .8em;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);letter-spacing:.2em}
.lock input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.lock .err{color:#ff9b8f;font-size:.85rem;min-height:1.1em}
.lock .row{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div id="hot" aria-hidden="true"></div>
<button class="gear" id="gear" aria-label="Admin login"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span id="gearTxt">Admin login</span></button>
<div class="book anim" id="book"></div>
<div class="bar">
  <span id="hint"> Swipe to next </span>
  <span id="count"></span>
</div>
<div class="lock" id="lock">
  <form id="lockForm" autocomplete="on">
    <h2>Admin PIN</h2>
    <input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <div class="err" id="err" role="alert"></div>
    <div class="row">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button type="submit" class="btn pri">Sign in</button>
    </div>
  </form>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="Admin">
  <header>
    <h1>Manage photos</h1>
    <div style="display:flex;gap:8px">
      <button class="btn pri" id="add">Add photos</button>
      <button class="btn" id="done">Done</button>
      <button class="btn del" id="logout">Log out</button>
    </div>
  </header>
  <div class="list" id="list"></div>
  <input type="file" id="fileAdd" accept="image/*" multiple hidden>
  <input type="file" id="fileRep" accept="image/*" hidden>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ====== FILL THESE IN (Supabase > Project Settings > API) ======
const SUPABASE_URL="https://fyaqmqherkrhitjmikgz.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_MYnK8Z53NTJ4N3UkJRxVKQ_KQNNw890";
const ADMIN_EMAIL="markabeleda13@gmail.com"; // your Supabase admin user
// ================================================================
function scene(sky1,sky2,sun,h1,h2,h3,sx){
  const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 860" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="600" height="860" fill="url(#g)"/><circle cx="${sx}" cy="300" r="70" fill="${sun}"/><path d="M0 560 Q150 440 300 540 T600 500 V860 H0Z" fill="${h1}"/><path d="M0 660 Q200 560 380 650 T600 620 V860 H0Z" fill="${h2}"/><path d="M0 760 Q220 690 600 750 V860 H0Z" fill="${h3}"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
}
const DEFAULTS=[
  scene('#f6b36b','#f6e3b4','#fff4d0','#7a6a8a','#4e5a7a','#2c3a5a',410),
  scene('#4a7fb5','#bfe0f0','#ffffff','#5c8f6a','#3f7050','#2b5238',150),
  scene('#e8736c','#fbd3a0','#fff0c8','#a64d5a','#7a3a58','#4a2a50',300),
  scene('#1d2b5a','#5a6fb0','#e9eefc','#2a3a6a','#1c284f','#10183a',460),
  scene('#9fd3c7','#eaf6e4','#fffbe0','#79b08a','#4f9070','#2f6a55',190)
].map((src,i)=>({id:'d'+i,src}));

let photos=[],loaded=false,sig="";
const book=document.getElementById('book');
let pages=[],N=0,idx=0;
function setP(el,p){el.style.transform=`rotateY(${-p*105}deg)`;el.style.opacity=p>=1?0:1;el.style.pointerEvents=p>=1?'none':'auto'}
function build(){
  book.innerHTML='';pages=[];
  photos.forEach(p=>{const s=document.createElement('section');s.className='page';const im=document.createElement('img');im.src=p.src;im.alt='';im.draggable=false;s.appendChild(im);book.appendChild(s);pages.push(s)});
  if(!photos.length){const s=document.createElement('section');s.className='page';book.appendChild(s);pages.push(s)}
  N=pages.length;idx=Math.min(idx,N-1);render();
}
function render(){
  book.classList.add('anim');
  pages.forEach((el,i)=>{el.style.zIndex=N-i;setP(el,i<idx?1:0)});
  hint.textContent=idx>=N-1?'← Swipe back':'Swipe to next →';
  count.textContent=photos.length?`${idx+1} / ${N}`:'';
}
const hint=document.getElementById('hint'),count=document.getElementById('count');
function go(d){idx=Math.max(0,Math.min(N-1,idx+d));render()}
addEventListener('keydown',e=>{if(sheet.classList.contains('open'))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});

let sx=null,st=0,drag=null,w=1;
book.addEventListener('pointerdown',e=>{sx=e.clientX;st=Date.now();w=book.offsetWidth;drag=null;book.setPointerCapture(e.pointerId)});
book.addEventListener('pointermove',e=>{
  if(sx===null)return;const dx=e.clientX-sx;
  if(Math.abs(dx)<6&&!drag)return;
  book.classList.remove('anim');
  if(dx<0&&idx<N-1){const p=Math.min(1,-dx/w*1.2);drag={el:pages[idx],dir:1,p};drag.el.style.transform=`rotateY(${-p*105}deg)`;drag.el.style.opacity=1-p*.5}
  else if(dx>0&&idx>0){const p=1-Math.min(1,dx/w*1.2);drag={el:pages[idx-1],dir:-1,p};drag.el.style.zIndex=100;drag.el.style.opacity=1-p*.5;drag.el.style.pointerEvents='auto';drag.el.style.transform=`rotateY(${-p*105}deg)`}
});
function endDrag(e){
  if(sx===null)return;const dx=e.clientX-sx,fast=Math.abs(dx)/(Date.now()-st)>.5;sx=null;
  if(drag){const moved=drag.dir===1?drag.p:1-drag.p;if(moved>.3||(fast&&moved>.05))idx+=drag.dir}
  drag=null;render();
}
book.addEventListener('pointerup',endDrag);book.addEventListener('pointercancel',endDrag);

// ---- Supabase ----
const configured=!SUPABASE_URL.includes('YOUR-PROJECT');
const sb=configured&&window.supabase?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const sheet=document.getElementById('sheet'),list=document.getElementById('list');
const fileAdd=document.getElementById('fileAdd'),fileRep=document.getElementById('fileRep'),gear=document.getElementById('gear');
const lock=document.getElementById('lock'),pw=document.getElementById('pw'),err=document.getElementById('err');
let repIndex=-1,rows=[];
const pub=p=>sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
const CK='photobook-cache';
function show(list){const k=JSON.stringify(list.map(p=>p.src));if(loaded&&k===sig)return;sig=k;loaded=true;photos=list;build()}
function preload(src){return new Promise(r=>{const im=new Image();im.onload=im.onerror=()=>r();im.src=src;setTimeout(r,5000)})}
async function refresh(){
  if(!sb){show(DEFAULTS.slice());return}
  const {data,error}=await sb.from('photos').select('*').order('sort');
  if(error){console.warn(error);if(!loaded)show(DEFAULTS.slice());return}
  rows=data;
  const list=rows.map(r=>({id:r.id,src:pub(r.path)}));
  if(list.length){
    try{localStorage.setItem(CK,JSON.stringify(list))}catch(e){}
    await Promise.all(list.slice(0,2).map(p=>preload(p.src)));
  }else{try{localStorage.removeItem(CK)}catch(e){}}
  show(list.length?list:DEFAULTS.slice());
  if(sheet.classList.contains('open'))renderList();
}
try{const c=JSON.parse(localStorage.getItem(CK)||'null');if(Array.isArray(c)&&c.length)show(c)}catch(e){}
refresh();
if(sb){sb.channel('photos-live').on('postgres_changes',{event:'*',schema:'public',table:'photos'},refresh).subscribe()}

const gearTxt=document.getElementById('gearTxt');
function setAuth(on){gearTxt.textContent=on?'Admin':'Admin login';gear.setAttribute('aria-label',on?'Open admin':'Admin login')}
if(sb){sb.auth.signOut().catch(()=>{});sb.auth.onAuthStateChange((e,session)=>setAuth(!!session))}
document.getElementById('logout').onclick=async()=>{
  try{await sb.auth.signOut()}catch(e){console.warn(e)}
  sheet.classList.remove('open');setAuth(false);
};
const hot=document.getElementById('hot');let taps=[],hideT=null;
hot.addEventListener('pointerup',()=>{
  const t=Date.now();taps=taps.filter(x=>t-x<700);taps.push(t);
  if(taps.length>=3){
    taps=[];gear.classList.add('show');clearTimeout(hideT);
    hideT=setTimeout(()=>gear.classList.remove('show'),6000);
  }
});
gear.onclick=async()=>{
  clearTimeout(hideT);gear.classList.remove('show');
  if(!sb){alert('Add your Supabase URL and anon key at the top of the script first.');return}
  err.textContent='';pw.value='';lock.classList.add('open');setTimeout(()=>pw.focus(),50);
};
document.getElementById('cancel').onclick=()=>lock.classList.remove('open');
document.getElementById('lockForm').onsubmit=async e=>{
  e.preventDefault();
  const {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password:pw.value});
  if(error){err.textContent='Failed: '+(error.message||'unknown error');pw.value='';return}
  lock.classList.remove('open');pw.value='';sheet.classList.add('open');renderList();
};
document.getElementById('done').onclick=async()=>{sheet.classList.remove('open');try{await sb.auth.signOut()}catch(e){console.warn(e)}setAuth(false)};
document.getElementById('add').onclick=()=>fileAdd.click();

function resize(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('bad')),'image/jpeg',.85)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};im.src=url})}
async function upload(file){
  const path=crypto.randomUUID()+'.jpg';
  const {error}=await sb.storage.from('photos').upload(path,await resize(file),{contentType:'image/jpeg'});
  if(error)throw error;return path;
}
async function guard(fn){try{await fn();await refresh()}catch(e){console.warn(e);alert('Failed: '+(e&&e.message||'unknown error'))}}
fileAdd.onchange=()=>guard(async()=>{
  const files=[...fileAdd.files];fileAdd.value='';
  let sort=rows.length?Math.max(...rows.map(r=>r.sort)):0;
  for(const f of files){const path=await upload(f);const {error}=await sb.from('photos').insert({path,sort:++sort});if(error)throw error}
});
fileRep.onchange=()=>guard(async()=>{
  const f=fileRep.files[0];fileRep.value='';const r=rows[repIndex];if(!f||!r)return;
  const path=await upload(f);
  const {error}=await sb.from('photos').update({path}).eq('id',r.id);if(error)throw error;
  sb.storage.from('photos').remove([r.path]);
});
const move=(i,d)=>guard(async()=>{
  const j=i+d;if(j<0||j>=rows.length)return;const a=rows[i],b=rows[j];
  let r=await sb.from('photos').update({sort:b.sort}).eq('id',a.id);if(r.error)throw r.error;
  r=await sb.from('photos').update({sort:a.sort}).eq('id',b.id);if(r.error)throw r.error;
});
const remove=i=>guard(async()=>{
  const r=rows[i];if(!r||!confirm('Remove this photo for everyone?'))return;
  const {error}=await sb.from('photos').delete().eq('id',r.id);if(error)throw error;
  sb.storage.from('photos').remove([r.path]);
});
function renderList(){
  list.innerHTML='';
  if(!rows.length){list.innerHTML='<div class="empty">No shared photos yet. Tap “Add photos”.</div>';return}
  rows.forEach((p,i)=>{
    const row=document.createElement('div');row.className='item';
    row.innerHTML=`<img alt="" src="${pub(p.path)}"><div class="meta">Page ${i+1}</div><div class="acts"></div>`;
    const acts=row.querySelector('.acts');
    const mk=(t,cls,fn,label)=>{const b=document.createElement('button');b.className='btn '+(cls||'');b.textContent=t;if(label)b.setAttribute('aria-label',label);b.onclick=fn;acts.appendChild(b)};
    mk('↑','',()=>move(i,-1),'Move page earlier');
    mk('↓','',()=>move(i,1),'Move page later');
    mk('Replace','',()=>{repIndex=i;fileRep.click()});
    mk('Remove','del',()=>remove(i));
    list.appendChild(row);
  });
}
if(!loaded)count.textContent='Loading…';
</script>
</body>
</html>
