<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mix It Your Way</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Container holding the 3D perspective */
    .book-container {
      perspective: 1500px;
      width: 90vw;
      max-width: 420px;
      height: 70vh;
      max-height: 600px;
      position: relative;
      touch-action: pan-y;
    }

    /* Book structure */
    .book {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Individual Page Cards */
    .page {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      user-select: none;
      will-change: transform;
    }

    /* Disable animation transitions during dragging for real-time tracking */
    .page.dragging {
      transition: none !important;
    }

    /* Front and Back faces of each page */
    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 4px 12px 12px 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background-color: #FBF8F1;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      /* Force hardware acceleration to prevent flickering */
      transform: translateZ(0);
    }

    .back {
      transform: rotateY(180deg) translateZ(0);
      border-radius: 12px 4px 4px 12px;
    }

    /* Background Images for Each Side */
    .page-1-front { background-image: url('1.jpg'); }
    .page-1-back  { background-image: url(''); }

    .page-2-front { background-image: url('2.jpg'); }
    .page-2-back  { background-image: url(''); }

    .page-3-front { background-image: url('3.jpg'); }
    .page-3-back  { background-image: url(''); }

    .page-4-front { background-image: url('4.jpg'); }
    .page-4-back  { background-image: url(''); }

    .page-5-front { background-image: url('5.jpg'); }
    .page-5-back  { background-image: url(''); }
  
    .page-6-front { background-image: url('6.jpg'); }
    .page-6-back  { background-image: url(''); }
  
    .page-7-front { background-image: url('7.jpg'); }
    .page-7-back  { background-image: url(''); }
  
    .page-8-front { background-image: url('8.jpg'); }
    .page-8-back  { background-image: url(''); }

    .page-9-front { background-image: url('9.jpg'); }
    .page-9-back  { background-image: url(''); }

    .page-10-front { background-image: url('10.jpg'); }
    .page-10-back  { background-image: url(''); }
  
    .page-11-front { background-image: url('11.jpg'); }
    .page-11-back  { background-image: url(''); }
  
    /* Spine shadow effect */
    .front::before, .back::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 28px;
      pointer-events: none;
    }
    .front::before {
      left: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.18), transparent);
    }
    .back::after {
      right: 0;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.18), transparent);
    }

    /* Page Footer Styling */
    .page-footer {
      text-align: center;
      font-size: 0.85rem;
      color: #ffffff;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }

    /* Flipped State */
    .page.flipped {
      transform: rotateY(-180deg);
    }

    /* Instruction Hint Styling */
    .hint {
      margin-top: 24px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="book-container" id="bookContainer">
    <div class="book" id="book">

      <!-- Sheet 1 -->
      <div class="page" style="z-index: 8;">
        <div class="front page-1-front">
          <div></div>
          <div class="page-footer"></div>

        <div class="back page-1-back">

      <!-- Sheet 7 -->
      <div class="page" style="z-index: 2;">
        <div class="front page-7-front">

      <!-- Sheet 8 -->
      <div class="page" style="z-index: 1;">
        <div class="front page-8-front">

        <div class="back page-8-back">

        </div>
      </div>   
      
      <!-- Sheet 9 -->
      <div class="page" style="z-index: 1;">
        <div class="front page-9-front">
          <div></div>

        </div>
        <div class="back page-9-back">
          <div></div>
          <div class="page-footer"></div>
        </div>
      </div>   
      
      <!-- Sheet 10 -->
      <div class="page" style="z-index: 1;">
        <div class="front page-10-front">
          <div></div>

        </div>
        <div class="back page-10-back">

          <div class="page-footer"></div>
        </div>
      </div>   
      
      <!-- Sheet 11 -->
      <div class="page" style="z-index: 1;">
        <div class="front page-11-front">
          <div></div>
          <div class="page-footer"></div>
        </div>
        <div class="back page-11-back">
          <div></div>
          <div class="page-footer"></div>
        </div>
      </div>         

    </div>
  </div>

  <div class="hint">&larr; Swipe to next page &rarr;</div>

  <script>
    const pages = Array.from(document.querySelectorAll('.page'));
    const bookContainer = document.getElementById('bookContainer');

    let currentSheet = 0;
    const totalSheets = pages.length;

    function updatePageZIndex() {
      pages.forEach((page, index) => {
        if (index < currentSheet) {
          page.style.zIndex = index + 1;
        } else {
          page.style.zIndex = totalSheets - index;
        }
      });
    }

    function goNext() {
      if (currentSheet < totalSheets) {
        const targetPage = pages[currentSheet];
        targetPage.classList.remove('dragging');
        targetPage.style.transform = '';
        targetPage.classList.add('flipped');
        currentSheet++;
        updatePageZIndex();
      }
    }

    function goPrev() {
      if (currentSheet > 0) {
        currentSheet--;
        const targetPage = pages[currentSheet];
        targetPage.classList.remove('dragging');
        targetPage.style.transform = '';
        targetPage.classList.remove('flipped');
        updatePageZIndex();
      }
    }

    // Direct click/tap on pages to flip
    pages.forEach((page, index) => {
      page.addEventListener('click', (e) => {
        // Prevent click trigger if dragging occurred
        if (isDragging) return;
        if (index === currentSheet) {
          goNext();
        } else if (index === currentSheet - 1) {
          goPrev();
        }
      });
    });

    // Touch Swipe with Smooth Dragging
    let startX = 0;
    let currentX = 0;
    let isDragging = false;
    let activePage = null;

    bookContainer.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      currentX = startX;
      isDragging = false;

      // Identify active page for dragging
      if (currentSheet < totalSheets) {
        activePage = pages[currentSheet];
      }
    }, { passive: true });

    bookContainer.addEventListener('touchmove', (e) => {
      currentX = e.touches[0].clientX;
      const diffX = currentX - startX;

      if (Math.abs(diffX) > 10) {
        isDragging = true;
      }

      // Drag forward page
      if (diffX < 0 && currentSheet < totalSheets) {
        activePage = pages[currentSheet];
        activePage.classList.add('dragging');
        const rot = Math.max(-180, Math.min(0, (diffX / window.innerWidth) * 280));
        activePage.style.transform = `rotateY(${rot}deg)`;
      }
      // Drag back previous page
      else if (diffX > 0 && currentSheet > 0) {
        activePage = pages[currentSheet - 1];
        activePage.classList.add('dragging');
        const rot = Math.min(0, Math.max(-180, -180 + (diffX / window.innerWidth) * 280));
        activePage.style.transform = `rotateY(${rot}deg)`;
      }
    }, { passive: true });

    bookContainer.addEventListener('touchend', () => {
      if (!isDragging) return;

      const diffX = currentX - startX;
      const threshold = 50;

      if (diffX < -threshold) {
        goNext();
      } else if (diffX > threshold) {
        goPrev();
      } else {
        // Snap back to initial position if threshold not reached
        if (activePage) {
          activePage.classList.remove('dragging');
          activePage.style.transform = '';
        }
      }

      setTimeout(() => { isDragging = false; }, 50);
    }, { passive: true });

    // Initialize layout
    updatePageZIndex();
  </script>
</body>
</html>
